name: Semantic Release

on:
  push:
    branches: [ master, upgrade/prisma-and-dependencies ]
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      # Required for npm Trusted Publishing: the npm plugin requests a GitHub OIDC token and
      # exchanges it with the registry for a short-lived credential.
      id-token: write
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        token: ${{ secrets.GITHUB_TOKEN }}
        
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        # Trusted publishing needs npm >= 11.5.1, which ships with Node 24. Node 20 carries npm 10
        # and cannot perform the OIDC exchange.
        node-version: '24.x'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Install semantic-release dependencies
      run: |
        npm install --save-dev \
          semantic-release \
          @semantic-release/changelog \
          @semantic-release/git \
          @semantic-release/github \
          @semantic-release/npm \
          @semantic-release/commit-analyzer \
          @semantic-release/release-notes-generator \
          conventional-changelog-conventionalcommits
        
    - name: Build and test
      run: |
        npm run gen-example
        npm run test:type-check
        npm run lint
        npm run test:basic
        
    - name: Build package
      run: ./package.sh
      
    - name: Semantic Release
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # No NPM_TOKEN: auth is the OIDC exchange. Setting one would write a conflicting .npmrc.
      run: npx semantic-release